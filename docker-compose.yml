services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: krishmitra-frontend

    env_file:
      - ./frontend/.env.local

    ports:
      - "3000:3000"

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: krishmitra-backend

    env_file:
      - ./backend/.env.local

    restart: unless-stopped